name: Pull request preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # This privileged workflow always uses tools from the trusted default
      # branch. Never check out the PR head or execute scripts from its archive.
      - name: Check out trusted preview tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: preview-tools

      - name: Check hosting configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Add the CLOUDFLARE_ACCOUNT_ID repository secret}"
          : "${CLOUDFLARE_API_TOKEN:?Add the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Add the CLOUDFLARE_PAGES_PROJECT repository variable}"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]
          [[ "$CLOUDFLARE_PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]]

      - name: Prepare static files from the exact PR commit
        env:
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python preview-tools/scripts/prepare_preview.py \
            --repository "$PR_REPOSITORY" \
            --sha "$PR_HEAD_SHA" \
            --output "$RUNNER_TEMP/preview-site"

      - name: Set up Node for the deployment CLI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Deploy isolated Cloudflare preview
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_SEND_METRICS: 'false'
          NO_COLOR: '1'
        # Install/run Wrangler outside both the checked-out tools and PR files.
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.45.0 pages deploy "$RUNNER_TEMP/preview-site" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "pr-$PR_NUMBER" \
            --commit-hash "$PR_HEAD_SHA" \
            --commit-message "Preview PR #$PR_NUMBER" \
            --commit-dirty=true 2>&1 | tee "$RUNNER_TEMP/preview-deploy.log"
          python "$GITHUB_WORKSPACE/preview-tools/scripts/preview_url.py" \
            "$RUNNER_TEMP/preview-deploy.log" >> "$GITHUB_OUTPUT"

      - name: Add or update the preview comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pull.state !== 'open' || pull.head.sha !== sha) {
              core.info('Skipping comment for a closed PR or a superseded commit.');
              return;
            }
            const marker = '<!-- small-apps-cloudflare-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = `${marker}\n**Preview ready:** ${url}\n\n[Open Calculator](${url}/calculator/) · Commit \`${sha.slice(0, 7)}\`\n\nPublic preview for this pull request. GitHub Pages is unchanged.`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment => comment.user.login === 'github-actions[bot]' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
