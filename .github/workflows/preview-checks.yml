name: Preview tooling checks

on:
  pull_request:
    paths:
      - '.github/workflows/*preview*.yml'
      - 'scripts/prepare_preview.py'
      - 'scripts/preview_url.py'
      - 'tests/test_previews.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/*preview*.yml'
      - 'scripts/prepare_preview.py'
      - 'scripts/preview_url.py'
      - 'tests/test_previews.py'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test static staging and preview URL extraction
        run: python -m unittest discover -s tests -p 'test_*.py' -v
