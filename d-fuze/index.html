<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#222529" />
    <title>D::FUZE — App Lab</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=builder-motion" />
    <script src="motion.js?v=builder-motion" defer></script>
    <script src="rings.js?v=builder-motion" defer></script>
    <script src="experimental-motion.js?v=builder-motion" defer></script>
    <script src="level-schema.js?v=builder-motion" defer></script>
    <script src="levels.js?v=builder-motion" defer></script>
    <script src="engine.js?v=builder-motion" defer></script>
    <script src="audio.js?v=builder-motion" defer></script>
    <script src="input.js" defer></script>
    <script src="renderer.js?v=builder-motion" defer></script>
    <script src="game.js?v=builder-motion" defer></script>
  </head>
  <body>
    <main class="game">
      <p id="test-mode" hidden>TEST MODE</p>
      <header>
        <a href="../#apps" aria-label="Back to App Lab">← APP LAB</a>
        <h1>D<span>::</span>FUZE</h1>
        <div class="tools">
          <button id="sound" aria-pressed="false">SOUND ON</button
          ><button id="pause" disabled>PAUSE</button>
        </div>
      </header>
      <section class="hud" aria-label="Game status">
        <span>LEVEL <b id="level">1</b></span
        ><span>AMMO <b id="ammo">24</b></span
        ><span>BOMB <b id="health">3</b></span
        ><span>GATE <b id="gate-health">2</b></span
        ><span id="lives" aria-label="3 lives">♥ ♥ ♥</span>
      </section>
      <div class="arena">
        <button class="control fire" data-control="fire">
          FIRE<small>SPACE</small>
        </button>
        <div class="field">
          <canvas
            id="canvas"
            aria-label="Circular playfield: turret orbiting a red ring with a blue destructible gate and a bomb. Countdown shown in the center."
          ></canvas>
          <section id="overlay" aria-labelledby="message">
            <div class="panel">
              <p class="eyebrow" id="tagline">ONE RING / ONE BOMB</p>
              <h2 id="message">D::FUZE</h2>
              <p id="detail">Orbit. Fire. Beat the countdown.</p>
              <div id="actions"></div>
            </div>
          </section>
        </div>
        <div class="rotation">
          <button class="control" data-control="ccw">
            ↶ CCW<small>← / A</small></button
          ><button class="control" data-control="cw">
            CW ↷<small>→ / D</small>
          </button>
        </div>
      </div>
      <footer>
        ROTATE <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd>
        <span>FIRE <kbd>SPACE</kbd></span> <span>PAUSE <kbd>ESC</kbd></span>
      </footer>
      <pre id="debug" hidden aria-label="Developer game information"></pre>
    </main>
    <section
      id="orientation-overlay"
      role="status"
      aria-live="polite"
      aria-labelledby="orientation-title"
      tabindex="-1"
      hidden
    >
      <div>
        <h2 id="orientation-title">ROTATE YOUR PHONE</h2>
        <p>D::FUZE is best played in portrait mode.</p>
      </div>
    </section>
  </body>
</html>
